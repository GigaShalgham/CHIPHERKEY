# CipherKey build configuration.
#
# The Gradle JVM is deliberately given a large share of available memory and
# Kotlin compilation is run in-process so that a single daemon performs all
# compilation work. This keeps peak memory usage predictable on machines with
# limited RAM while remaining correct (no parallel Kotlin compilation).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.incremental=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
